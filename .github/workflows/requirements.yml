name: Quality & Security Gates

on:
  push:
    branches: [develop]
    paths-ignore:
      - "infraestructura/**"
      - ".github/workflows/tf-infra.yml"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write 
  pull-requests: write     
  actions: read              

env:
  PYTHON_VERSION: "3.14"

jobs:

  unit-tests:
    name: "Tests & Coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias de test
        run: pip install -r requirements-test.txt

      - name: Ejecutar tests con cobertura
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

  dockerfile-lint:
    name: "Lint — Hadolint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  
  sast-bandit:
    name: "SAST — Bandit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Bandit
        run: pip install bandit

      - name: Ejecutar Bandit
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            --exit-zero
          bandit -r app/ -ll

      - name: Subir reporte Bandit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  sast-semgrep:
    name: "SAST — Semgrep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            app/ || echo "SEMGREP_EXIT=$?" >> "$GITHUB_ENV"

      - name: Fallar si hay hallazgos
        if: env.SEMGREP_EXIT != '' && env.SEMGREP_EXIT != '0'
        run: |
          echo "Semgrep encontró problemas de seguridad. Revisa el Security tab."
          exit 1

  sca-pip-audit:
    name: "SCA — pip-audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Auditar dependencias
        run: |
          pip-audit \
            -r requirements.txt \
            --format json \
            --output pip-audit-report.json

      - name: Subir reporte de auditoría
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 7

  secret-scan:
    name: "Secret Scan — Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: "Container Scan — Trivy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen para escaneo
        run: docker build -t scan-target:${{ github.sha }} .

      - name: Trivy — subir SARIF al Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy — tabla de resumen (bloquea en CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

  sonar:
    name: "SonarCloud Analysis"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}